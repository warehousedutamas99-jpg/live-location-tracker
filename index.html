<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Location Sharing - Realtime</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; background-color: #0f172a; color: #f8fafc; }
    
    header { background: #1e293b; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .title-container h2 { font-size: 18px; font-weight: 600; color: #f8fafc; }
    
    .status-badge { background: #334155; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #ef4444; display: inline-block; }
    .status-dot.active { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
    
    .container { display: flex; flex: 1; position: relative; overflow: hidden; }
    #map { flex: 1; height: 100%; background: #020617; }
    
    .sidebar { width: 320px; background: #1e293b; border-left: 1px solid #334155; padding: 20px; display: flex; flex-direction: column; gap: 16px; z-index: 500; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 12px; }
    .sidebar-header h3 { font-size: 15px; font-weight: 600; color: #f1f5f9; }
    .user-count { background: #0f172a; padding: 2px 8px; border-radius: 12px; font-size: 11px; color: #94a3b8; }
    
    .user-list { list-style: none; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
    .user-item { background: #0f172a; border: 1px solid #334155; padding: 12px 14px; border-radius: 8px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
    .user-item.is-me { border-left: 4px solid #38bdf8; }
    .user-item .user-name { font-weight: 600; color: #f8fafc; }
    .user-item .accuracy { font-size: 11px; color: #64748b; }
    .user-item .distance { color: #22c55e; font-weight: 600; font-size: 12px; margin-top: 2px; }

    @media (max-width: 640px) {
      .container { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 200px; border-left: none; border-top: 1px solid #334155; }
    }
  </style>
</head>
<body>

  <header>
    <div class="title-container">
      <h2>Live Location Sharing</h2>
    </div>
    <div class="status-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Mencari GPS...</span>
    </div>
  </header>

  <div class="container">
    <div id="map"></div>
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>Daftar Pengguna Aktif</h3>
        <span class="user-count" id="userCount">0 Pengguna</span>
      </div>
      <ul class="user-list" id="userList">
        <li style="color: #64748b; font-size: 12px; text-align: center; margin-top: 20px;">Menunggu koneksi pengguna...</li>
      </ul>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Database URL Publik Siap Pakai
    const DB_URL = "https://live-tracker-default-rtdb.asia-southeast1.firebasedatabase.app/users";

    const map = L.map('map').setView([-6.200000, 106.816666], 13);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    const myUserId = "User_" + Math.floor(1000 + Math.random() * 9000);
    const markers = {};
    let activeUsers = {};
    let myCoords = null;

    function hitungJarak(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const distance = R * c;

      return distance < 1 ? Math.round(distance * 1000) + " meter" : distance.toFixed(2) + " km";
    }

    // 1. Kirim Lokasi Kita ke Server
    function updateLokasiSaya(lat, lng, accuracy) {
      const data = {
        lat: lat,
        lng: lng,
        accuracy: accuracy,
        updatedAt: Date.now()
      };

      fetch(`${DB_URL}/${myUserId}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
    }

    // 2. Ambil Semua Lokasi User yang Aktif
    function syncSemuaUser() {
      fetch(`${DB_URL}.json`)
        .then(res => res.json())
        .then(data => {
          if (!data) data = {};
          activeUsers = data;

          const sekarang = Date.now();
          const activeIds = Object.keys(data);

          // Hapus user yang sudah tidak aktif (> 30 detik)
          for (let id in markers) {
            if (!data[id] || (sekarang - data[id].updatedAt > 30000)) {
              map.removeLayer(markers[id]);
              delete markers[id];
              delete activeUsers[id];
            }
          }

          // Update marker di peta
          Object.keys(activeUsers).forEach(id => {
            const user = activeUsers[id];
            if (sekarang - user.updatedAt <= 30000) { // Hanya yang aktif kurang dari 30 detik
              const isMe = id === myUserId;
              const popup = isMe ? `<b>Lokasi Saya</b> (${id})` : `<b>${id}</b>`;

              if (markers[id]) {
                markers[id].setLatLng([user.lat, user.lng]);
              } else {
                markers[id] = L.marker([user.lat, user.lng]).addTo(map).bindPopup(popup);
              }
            }
          });

          renderUserList();
        });
    }

    // 3. Jalankan GPS Realtime
    function startGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude, longitude, accuracy } = pos.coords;
            myCoords = { lat: latitude, lng: longitude };

            updateStatus(`AKTIF (±${Math.round(accuracy)}m)`, true);

            if (document.getElementById("statusText").innerText.includes("Mencari GPS")) {
              map.setView([latitude, longitude], 16);
            }

            updateLokasiSaya(latitude, longitude, Math.round(accuracy));
            syncSemuaUser();
          },
          (err) => {
            updateStatus("GPS Ditolak/Error", false);
            alert("Harap izinkan akses GPS di browser HP/PC Anda.");
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );
      }
    }

    function updateStatus(text, isActive) {
      document.getElementById("statusText").innerText = text;
      const dot = document.getElementById("statusDot");
      if (isActive) dot.classList.add("active");
      else dot.classList.remove("active");
    }

    function renderUserList() {
      const listEl = document.getElementById("userList");
      const countEl = document.getElementById("userCount");
      listEl.innerHTML = "";

      const keys = Object.keys(activeUsers);
      countEl.innerText = `${keys.length} Pengguna`;

      if (keys.length === 0) {
        listEl.innerHTML = '<li style="color: #64748b; font-size: 12px; text-align: center; margin-top: 20px;">Menunggu koneksi pengguna...</li>';
        return;
      }

      keys.forEach((id) => {
        const user = activeUsers[id];
        const isMe = id === myUserId;

        let distanceText = "Posisi Anda";
        if (!isMe && myCoords) {
          distanceText = "Jarak: " + hitungJarak(myCoords.lat, myCoords.lng, user.lat, user.lng);
        }

        const li = document.createElement("li");
        li.className = `user-item ${isMe ? 'is-me' : ''}`;
        li.innerHTML = `
          <div class="user-name">${isMe ? id + ' (Anda)' : id}</div>
          <div class="accuracy">Akurasi GPS: ±${user.accuracy}m</div>
          <div class="distance">${distanceText}</div>
        `;
        listEl.appendChild(li);
      });
    }

    // Jalankan Sinkronisasi setiap 3 detik
    startGPS();
    setInterval(syncSemuaUser, 3000);

    // Hapus data saat tab ditutup
    window.addEventListener('beforeunload', () => {
      fetch(`${DB_URL}/${myUserId}.json`, { method: 'DELETE' });
    });
  </script>

</body>
</html>
