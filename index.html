<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Location Sharing - Realtime Database</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; background-color: #111827; color: white; }
    header { background: #1f2937; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-bottom: 1px solid #374151; }
    .status-badge { background: #374151; padding: 6px 12px; border-radius: 12px; font-size: 13px; color: #34d399; font-weight: bold; }
    
    .container { display: flex; flex: 1; position: relative; }
    #map { flex: 1; height: 100%; background: #0f172a; }
    
    .sidebar { width: 280px; background: #1f2937; border-left: 1px solid #374151; padding: 15px; overflow-y: auto; }
    .sidebar h3 { font-size: 15px; margin-bottom: 10px; color: #f3f4f6; border-bottom: 1px solid #374151; padding-bottom: 6px; }
    .user-list { list-style: none; }
    .user-item { background: #374151; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
    .user-item strong { color: #60a5fa; }
    .user-item .distance { color: #34d399; font-weight: bold; font-size: 11px; }

    @media (max-width: 600px) {
      .container { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 150px; border-left: none; border-top: 1px solid #374151; }
    }
  </style>
</head>
<body>

  <header>
    <h2>Live Location Sharing</h2>
    <span class="status-badge" id="status">Menghubungkan GPS...</span>
  </header>

  <div class="container">
    <div id="map"></div>
    <div class="sidebar">
      <h3>Daftar Pengguna Aktif</h3>
      <ul class="user-list" id="userList">
        <li style="color: #9ca3af; font-size: 12px;">Mencari pengguna aktif...</li>
      </ul>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Firebase JS SDK (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // Konfigurasi Database Publik Siap Pakai
    const firebaseConfig = {
      databaseURL: "https://location-tracker-demo-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Inisialisasi Peta
    const map = L.map('map').setView([-6.200000, 106.816666], 13);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    const myUserId = "User_" + Math.floor(1000 + Math.random() * 9000);
    const markers = {};
    const activeUsers = {};
    let watchId = null;
    let myCoords = null;

    const userRef = database.ref('active_locations/' + myUserId);
    const allLocationsRef = database.ref('active_locations');

    // Hitung Jarak (Haversine)
    function hitungJarak(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const distance = R * c;

      return distance < 1 ? Math.round(distance * 1000) + " meter" : distance.toFixed(2) + " km";
    }

    // 1. Ambil Lokasi GPS Otomatis
    function startTrackingOtomatis() {
      if ("geolocation" in navigator) {
        watchId = navigator.geolocation.watchPosition(
          (position) => {
            const { latitude, longitude, accuracy } = position.coords;
            myCoords = { lat: latitude, lng: longitude };

            // Simpan & Update ke Firebase Realtime Database
            userRef.set({
              lat: latitude,
              lng: longitude,
              accuracy: Math.round(accuracy),
              lastUpdate: Date.now()
            });

            userRef.onDisconnect().remove(); // Hapus data otomatis saat tab/browser ditutup

            if (document.getElementById("status").innerText.includes("Menghubungkan")) {
              map.setView([latitude, longitude], 16);
            }

            document.getElementById("status").innerText = "AKTIF (±" + Math.round(accuracy) + "m)";
          },
          (err) => {
            document.getElementById("status").innerText = "GPS Ditolak/Error";
            alert("Harap izinkan akses lokasi GPS pada browser.");
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );
      }
    }

    // 2. Menerima Perubahan Data Pengguna Secara Realtime dari Firebase
    allLocationsRef.on('value', (snapshot) => {
      const data = snapshot.val() || {};

      // Hapus marker user yang offline
      for (let id in markers) {
        if (!data[id]) {
          map.removeLayer(markers[id]);
          delete markers[id];
          delete activeUsers[id];
        }
      }

      // Perbarui atau tambah marker semua user yang online
      for (let id in data) {
        const user = data[id];
        activeUsers[id] = user;

        const isMe = (id === myUserId);
        const labelText = isMe ? "<b>Lokasi Saya</b> (" + id + ")" : "<b>" + id + "</b>";

        if (markers[id]) {
          markers[id].setLatLng([user.lat, user.lng]);
        } else {
          markers[id] = L.marker([user.lat, user.lng]).addTo(map).bindPopup(labelText);
        }
      }

      perbaruiDaftarPengguna();
    });

    function perbaruiDaftarPengguna() {
      const userListEl = document.getElementById("userList");
      userListEl.innerHTML = "";

      const keys = Object.keys(activeUsers);
      if (keys.length === 0) {
        userListEl.innerHTML = '<li style="color: #9ca3af; font-size: 12px;">Mencari pengguna aktif...</li>';
        return;
      }

      keys.forEach((id) => {
        const user = activeUsers[id];
        const isMe = (id === myUserId);
        
        let teksJarak = "Posisi Anda";
        if (!isMe && myCoords) {
          teksJarak = "Jarak: " + hitungJarak(myCoords.lat, myCoords.lng, user.lat, user.lng);
        }

        const li = document.createElement("li");
        li.className = "user-item";
        li.innerHTML = `
          <strong>${isMe ? id + ' (Anda)' : id}</strong>
          <span class="distance">${teksJarak}</span>
        `;
        userListEl.appendChild(li);
      });
    }

    window.onload = () => {
      startTrackingOtomatis();
    };

    window.addEventListener('beforeunload', () => {
      userRef.remove();
    });
  </script>

</body>
</html>
