<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Location Sharing - Realtime</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; background-color: #0f172a; color: #f8fafc; }
    
    header { background: #1e293b; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .title-container h2 { font-size: 18px; font-weight: 600; color: #f8fafc; }
    
    .status-badge { background: #334155; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #ef4444; display: inline-block; }
    .status-dot.active { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
    
    .container { display: flex; flex: 1; position: relative; overflow: hidden; }
    #map { flex: 1; height: 100%; background: #020617; }
    
    .sidebar { width: 320px; background: #1e293b; border-left: 1px solid #334155; padding: 20px; display: flex; flex-direction: column; gap: 16px; z-index: 500; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 12px; }
    .sidebar-header h3 { font-size: 15px; font-weight: 600; color: #f1f5f9; }
    .user-count { background: #0f172a; padding: 2px 8px; border-radius: 12px; font-size: 11px; color: #94a3b8; }
    
    .user-list { list-style: none; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
    .user-item { background: #0f172a; border: 1px solid #334155; padding: 12px 14px; border-radius: 8px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
    .user-item.is-me { border-left: 4px solid #38bdf8; }
    .user-item .user-name { font-weight: 600; color: #f8fafc; }
    .user-item .accuracy { font-size: 11px; color: #64748b; }
    .user-item .distance { color: #22c55e; font-weight: 600; font-size: 12px; margin-top: 2px; }

    @media (max-width: 640px) {
      .container { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 200px; border-left: none; border-top: 1px solid #334155; }
    }
  </style>
</head>
<body>

  <header>
    <div class="title-container">
      <h2>Live Location Sharing</h2>
    </div>
    <div class="status-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Mencari GPS...</span>
    </div>
  </header>

  <div class="container">
    <div id="map"></div>
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>Daftar Pengguna Aktif</h3>
        <span class="user-count" id="userCount">0 Pengguna</span>
      </div>
      <ul class="user-list" id="userList">
        <li style="color: #64748b; font-size: 12px; text-align: center; margin-top: 20px;">Menunggu koneksi pengguna...</li>
      </ul>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Semua pengguna harus memakai endpoint Realtime Database yang SAMA.
    // Jika database/rules berbeda, lokasi tidak dapat dibagikan antarperangkat.
    // GitHub Pages hanya meng-host HTML. Sinkronisasi antarperangkat memerlukan
    // Firebase Realtime Database yang benar dan sama pada semua perangkat.
    // Masukkan URL database dari Firebase Console (contoh format: https://NAMA-DB.REGION.firebasedatabase.app).
    function getDatabaseBaseUrl() {
      const key = 'liveLocationFirebaseDatabaseUrl';
      let saved = '';
      try { saved = localStorage.getItem(key) || ''; } catch (_) {}
      if (!saved) {
        saved = prompt(
          'Masukkan URL Firebase Realtime Database Anda.\\n' +
          'Ambil URL dari Firebase Console > Build > Realtime Database.\\n' +
          'Jangan masukkan /users atau .json di akhir URL.'
        ) || '';
      }
      saved = saved.trim().replace(/\/+$/, '').replace(/\/users(?:\.json)?$/, '');
      if (saved && /^https:\/\//i.test(saved)) {
        try { localStorage.setItem(key, saved); } catch (_) {}
        return saved + '/users';
      }
      return '';
    }
    const DB_URL = getDatabaseBaseUrl();
    if (!DB_URL) {
      updateStatus('URL Firebase belum diatur', false);
      const list = document.getElementById('userList');
      list.innerHTML = '';
      const li = document.createElement('li');
      li.className = 'user-item';
      li.textContent = 'URL Firebase belum diatur. Muat ulang halaman lalu masukkan URL Realtime Database yang benar.';
      list.appendChild(li);
    }
    const ACTIVE_MS = 45000;
    const SYNC_MS = 3000;

    const map = L.map('map').setView([-6.200000, 106.816666], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // ID unik per tab/perangkat; jangan memakai ID acak baru setiap pembaruan lokasi.
    const myUserId = 'User_' + (crypto.randomUUID ? crypto.randomUUID().slice(0, 8) :
      Math.random().toString(36).slice(2, 10));
    const markers = Object.create(null);
    let activeUsers = {};
    let myCoords = null;
    let firstFix = true;
    let lastWriteError = '';

    function validUser(user) {
      return user && Number.isFinite(Number(user.lat)) &&
        Number.isFinite(Number(user.lng)) &&
        Number(user.lat) >= -90 && Number(user.lat) <= 90 &&
        Number(user.lng) >= -180 && Number(user.lng) <= 180 &&
        Number.isFinite(Number(user.updatedAt));
    }

    function hitungJarak(lat1, lon1, lat2, lon2) {
      const values = [lat1, lon1, lat2, lon2].map(Number);
      if (!values.every(Number.isFinite)) return 'Belum tersedia';
      const [aLat, aLon, bLat, bLon] = values;
      const R = 6371;
      const dLat = (bLat - aLat) * Math.PI / 180;
      const dLon = (bLon - aLon) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(aLat * Math.PI / 180) * Math.cos(bLat * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;
      const distance = 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return distance < 1 ? Math.round(distance * 1000) + ' meter' : distance.toFixed(2) + ' km';
    }

    async function updateLokasiSaya(lat, lng, accuracy) {
      if (!DB_URL) return;
      const data = { lat, lng, accuracy, updatedAt: Date.now(), userAgent: 'web' };
      try {
        const res = await fetch(`${DB_URL}/${encodeURIComponent(myUserId)}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          cache: 'no-store'
        });
        if (!res.ok) throw new Error(`Database menolak penyimpanan (HTTP ${res.status})`);
        lastWriteError = '';
      } catch (err) {
        lastWriteError = err.message || 'Tidak dapat menyimpan lokasi';
        updateStatus('Database error', false);
      }
    }

    async function syncSemuaUser() {
      if (!DB_URL) return;
      try {
        const res = await fetch(`${DB_URL}.json`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const now = Date.now();
        activeUsers = {};

        if (data && typeof data === 'object') {
          for (const [id, user] of Object.entries(data)) {
            // Abaikan data lama/rusak seperti "error", undefined, atau NaN.
            if (!validUser(user)) continue;
            if (now - Number(user.updatedAt) > ACTIVE_MS) continue;
            activeUsers[id] = user;
          }
        }

        for (const id of Object.keys(markers)) {
          if (!activeUsers[id]) {
            map.removeLayer(markers[id]);
            delete markers[id];
          }
        }

        for (const [id, user] of Object.entries(activeUsers)) {
          const point = [Number(user.lat), Number(user.lng)];
          const isMe = id === myUserId;
          const popup = isMe ? `<b>Lokasi Anda</b><br>${id}` : `<b>${id}</b>`;
          if (markers[id]) {
            markers[id].setLatLng(point);
            markers[id].setPopupContent(popup);
          } else {
            markers[id] = L.marker(point).addTo(map).bindPopup(popup);
          }
        }
        renderUserList();
        if (lastWriteError) updateStatus('Gagal menyimpan lokasi', false);
      } catch (err) {
        updateStatus('Database tidak terhubung', false);
        const list = document.getElementById('userList');
        list.innerHTML = '';
        const li = document.createElement('li');
        li.className = 'user-item';
        li.textContent = 'Tidak dapat membaca database. Periksa URL Realtime Database dan Rules Firebase. Detail: ' + (err.message || err);
        list.appendChild(li);
        document.getElementById('userCount').textContent = 'Koneksi gagal';
      }
    }

    function startGPS() {
      if (!('geolocation' in navigator)) {
        updateStatus('GPS tidak didukung', false);
        alert('Browser ini tidak mendukung GPS.');
        return;
      }
      if (!window.isSecureContext) {
        updateStatus('Perlu HTTPS', false);
        alert('Akses lokasi memerlukan HTTPS. Buka link website https:// atau localhost.');
        return;
      }
      updateStatus('Meminta izin GPS...', false);
      navigator.geolocation.watchPosition(async (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        myCoords = { lat: latitude, lng: longitude };
        updateStatus(`AKTIF (±${Math.round(accuracy)}m)`, true);
        if (firstFix) {
          map.setView([latitude, longitude], 16);
          firstFix = false;
        }
        await updateLokasiSaya(latitude, longitude, Math.round(accuracy));
        await syncSemuaUser();
      }, (err) => {
        const messages = {
          1: 'Izin GPS ditolak',
          2: 'Lokasi tidak tersedia',
          3: 'GPS timeout'
        };
        updateStatus(messages[err.code] || 'GPS error', false);
        alert((messages[err.code] || 'GPS gagal') + '. Izinkan akses lokasi pada browser dan coba lagi.');
      }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
    }

    function updateStatus(text, isActive) {
      document.getElementById('statusText').textContent = text;
      const dot = document.getElementById('statusDot');
      dot.classList.toggle('active', Boolean(isActive));
    }

    function renderUserList() {
      const listEl = document.getElementById('userList');
      const countEl = document.getElementById('userCount');
      listEl.innerHTML = '';
      const entries = Object.entries(activeUsers);
      countEl.textContent = `${entries.length} Pengguna`;

      if (!entries.length) {
        const li = document.createElement('li');
        li.style.cssText = 'color:#94a3b8;font-size:12px;text-align:center;margin-top:20px;';
        li.textContent = 'Menunggu pengguna lain membuka link dan mengizinkan GPS...';
        listEl.appendChild(li);
        return;
      }

      entries.sort(([a], [b]) => (a === myUserId ? -1 : b === myUserId ? 1 : 0));
      for (const [id, user] of entries) {
        const isMe = id === myUserId;
        const li = document.createElement('li');
        li.className = `user-item ${isMe ? 'is-me' : ''}`;
        const name = document.createElement('div');
        name.className = 'user-name';
        name.textContent = isMe ? `${id} (Anda)` : id;
        const accuracy = document.createElement('div');
        accuracy.className = 'accuracy';
        accuracy.textContent = `Akurasi GPS: ±${Math.round(Number(user.accuracy) || 0)}m`;
        const distance = document.createElement('div');
        distance.className = 'distance';
        distance.textContent = isMe ? 'Posisi Anda' :
          (myCoords ? 'Jarak: ' + hitungJarak(myCoords.lat, myCoords.lng, user.lat, user.lng) : 'Menghitung jarak...');
        li.append(name, accuracy, distance);
        li.addEventListener('click', () => {
          map.setView([Number(user.lat), Number(user.lng)], 16);
          if (markers[id]) markers[id].openPopup();
        });
        listEl.appendChild(li);
      }
    }

    // Polling juga berjalan saat GPS tidak mengirim perubahan posisi.
    if (DB_URL) {
      startGPS();
      syncSemuaUser();
      setInterval(syncSemuaUser, SYNC_MS);
    }

    // Jangan hapus data saat tab ditutup: beforeunload sering dibatalkan browser.
    // Data otomatis dianggap tidak aktif setelah ACTIVE_MS tanpa heartbeat.
    window.addEventListener('pagehide', () => {
      try {
        if (!DB_URL) return;
        navigator.sendBeacon(`${DB_URL}/${encodeURIComponent(myUserId)}.json`,
          new Blob(['null'], { type: 'application/json' }));
      } catch (_) {}
    });
  </script>

</body>
</html>
